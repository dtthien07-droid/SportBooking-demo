<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thông báo về lịch đặt sân, thanh toán và hệ thống SportBooking.">
  <title>Thông báo - SportBooking</title>
  <link rel="stylesheet" href="/shared/header.css">
  <link rel="stylesheet" href="/notifications/notifications.css">
  <script src="/shared/icons.js"></script>
  <script src="/notifications/notifications-state.js"></script>
</head>
<body data-page="notifications">
  <div data-shared-header></div>
  <main class="notifications-page">
    <div class="notifications-shell">
      <div class="notifications-topline">
        <button class="notifications-back" id="notifications-back" type="button" aria-label="Quay lại">
          <svg data-sb-icon="arrow_back"></svg><span>Quay lại</span>
        </button>
      </div>
      <section class="notifications-section" aria-labelledby="notifications-page-title">
        <div class="notifications-heading">
          <div class="notifications-heading__title">
            <h1 id="notifications-page-title">Thông báo</h1>
            <span class="notifications-unread-badge" data-notifications-unread-count hidden></span>
          </div>
          <button class="notifications-read-all" id="notifications-read-all" type="button">
            <svg data-sb-icon="check_circle" aria-hidden="true"></svg>
            <span>Đánh dấu tất cả đã đọc</span>
          </button>
        </div>
        <div class="notifications-layout">
          <aside class="notifications-sidebar" aria-label="Phân loại thông báo">
            <div class="notifications-sidebar__heading">
              <h2>Phân loại</h2>
              <span class="notifications-sidebar__count" id="notifications-count-total">0 thông báo</span>
            </div>
            <nav class="notifications-tabs" aria-label="Lọc thông báo">
              <button class="notifications-tab" type="button" data-notification-category data-category="all" data-label="Tất cả thông báo" aria-pressed="true">
                <span class="notifications-tab__label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v13H4zM4 7l8 6 8-6M18 3v4m-2-2h4"/></svg>
                  Tất cả thông báo
                </span>
              </button>
              <button class="notifications-tab" type="button" data-notification-category data-category="BOOKING_HOLD" data-label="Lịch đặt sân &amp; Giữ chỗ" aria-pressed="false">
                <span class="notifications-tab__label"><svg data-sb-icon="event_available" aria-hidden="true"></svg>Lịch đặt sân &amp; Giữ chỗ</span>
              </button>
              <button class="notifications-tab" type="button" data-notification-category data-category="MATCH" data-label="Tìm đối &amp; Ghép kèo" aria-pressed="false" disabled>
                <span class="notifications-tab__label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8.5 10 5.5a2.1 2.1 0 0 1 3 0l1 1-3.5 3.5m-2.5-1.5-2 2a2.1 2.1 0 0 0 0 3l1 1 3-3m3-3 2-2a2.1 2.1 0 0 1 3 0l1 1a2.1 2.1 0 0 1 0 3l-5 5a2.1 2.1 0 0 1-3 0l-1-1"/></svg>
                  Tìm đối &amp; Ghép kèo
                </span>
                <span class="notifications-tab__soon">Sắp có</span>
              </button>
              <button class="notifications-tab" type="button" data-notification-category data-category="PAYMENT" data-label="Thanh toán &amp; Hoàn cọc" aria-pressed="false">
                <span class="notifications-tab__label"><svg data-sb-icon="account_balance_wallet" aria-hidden="true"></svg>Thanh toán &amp; Hoàn cọc</span>
              </button>
              <button class="notifications-tab" type="button" data-notification-category data-category="SYSTEM" data-label="Hệ thống" aria-pressed="false">
                <span class="notifications-tab__label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l7 4V6l-7 4H4Zm11-1 4-3m-4 9 4 3m-11-2 1 4"/></svg>
                  Hệ thống
                </span>
              </button>
            </nav>
          </aside>
          <div class="notifications-content">
            <div class="notifications-content__heading" id="notifications-content-heading">
              <h2 id="notifications-title">Tất cả thông báo</h2>
            </div>
            <div class="notifications-status" id="notifications-loading" role="status" hidden>
              <strong>Đang tải thông báo…</strong>
              <p>Vui lòng đợi trong giây lát.</p>
            </div>
            <div class="notifications-status notifications-status--error" id="notifications-error" role="alert" hidden>
              <strong>Không thể tải thông báo</strong>
              <p data-error-message></p>
              <button class="notifications-retry" id="notifications-retry" type="button">Thử lại</button>
            </div>
            <div class="notifications-empty" id="notifications-empty" hidden>
              <svg data-sb-icon="notifications" class="notifications-empty__icon"></svg>
              <h2>Không có thông báo nào</h2>
              <p>Thông báo về lịch đặt sân và tài khoản sẽ xuất hiện ở đây khi có cập nhật.</p>
              <a href="/tim-san.html">Khám phá &amp; Đặt sân ngay</a>
            </div>
            <div class="notifications-list" id="notifications-list" aria-live="polite" hidden></div>
            <nav class="notifications-pagination" id="notifications-pagination" aria-label="Phân trang" hidden>
              <button class="notifications-page-button" id="notifications-previous" type="button">Trước</button>
              <span id="notifications-page-info"></span>
              <button class="notifications-page-button" id="notifications-next" type="button">Tiếp</button>
            </nav>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="/shared/back-nav.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/notifications/notifications-page.js"></script>
</body>
</html>
